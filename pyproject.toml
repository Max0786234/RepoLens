[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "2.0.0"
description = "Evidence-first agentic assistant for understanding codebases: hybrid code search, a tool-using agent and verified citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max" }]
keywords = ["llm", "agent", "rag", "code-search", "bm25", "embeddings", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
st = ["sentence-transformers>=3.0"]
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.23",
]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.40", "repolens[treesitter]"]

[project.scripts]
repolens = "repolens.cli:main"

[project.urls]
Repository = "https://github.com/Max0786234/RepoLens"

[tool.setuptools.packages.find]
include = ["repolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ollama: needs a running Ollama server (deselected by default in CI)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"repolens/baseline_v1.py" = ["SIM", "UP"]
