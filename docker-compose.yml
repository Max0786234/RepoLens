# Fully local stack: RepoLens UI + Ollama.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3:4b-instruct
#   docker compose exec ollama ollama pull embeddinggemma
# then open http://localhost:8501
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  repolens:
    build: .
    depends_on:
      - ollama
    environment:
      REPOLENS_LLM_BASE_URL: http://ollama:11434/v1
      REPOLENS_EMBED_BASE_URL: http://ollama:11434/v1
    volumes:
      - repolens-cache:/data
    ports:
      - "8501:8501"

volumes:
  ollama:
  repolens-cache:
